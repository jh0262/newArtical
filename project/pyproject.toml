[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alg1-replan"
version = "0.1.0"
description = "Deterministic CVGR mechanism core; no optimizer execution entry point."
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
